<title>IAR Portal Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,500&family=Source+Sans+3:wght@400;500;600&display=swap">
<style>
/* Layout: sticky top bar with role switcher; left module rail; working area; slide-in demo guide on the right. */
:root {
  /* IAR brand: green #0B2E12, gold #D4AF37, light gold #F7DC86, cream #F6EEDB, dark gold #6E4C06 */
  --bg: #faf6ea;
  --surface: #ffffff;
  --surface-2: #f3ecd6;
  --ink: #16221a;
  --ink-2: #5a6558;
  --ink-3: #82897a;
  --line: #e6dcc0;
  --accent: #0b2e12;
  --accent-ink: #f6eedb;
  --accent-text: #0b2e12;
  --accent-soft: #e3ecdd;
  --gold: #d4af37;
  --gold-light: #f7dc86;
  --cream: #f6eedb;
  --ok: #1c7347;
  --ok-soft: #dcf0e3;
  --warn: #6e4c06;
  --warn-soft: #f7ecc6;
  --bad: #a1302a;
  --bad-soft: #f7e0dd;
  --info: #2c5a94;
  --info-soft: #e1eaf6;
  --hold-standing: #c9d2ce;
  --hold-booking: #9fb8ad;
  --hold-request: #0b2e12;
  --src1: #2a78d6;
  --src2: #eb6834;
  --src3: #1baf7a;
  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --font: "Source Sans 3", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: var(--font);
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #07190b; --surface: #0b2e12; --surface-2: #123a1a; --ink: #f6eedb; --ink-2: #b9bfa9; --ink-3: #8c9580;
    --line: #2f4a30; --accent: #d4af37; --accent-ink: #0b2e12; --accent-text: #d3e2cc; --accent-soft: #1d3d1f;
    --ok: #74d29d; --ok-soft: #1a3526; --warn: #efe6cf; --warn-soft: #4a3c14; --bad: #f19a92; --bad-soft: #3c2220;
    --info: #8fb6ea; --info-soft: #1d2b3e; --hold-standing: #34413c; --hold-booking: #3f5a4f; --hold-request: #d4af37; --src1: #3987e5; --src2: #d95926; --src3: #199e70;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #07190b; --surface: #0b2e12; --surface-2: #123a1a; --ink: #f6eedb; --ink-2: #b9bfa9; --ink-3: #8c9580;
  --line: #2f4a30; --accent: #d4af37; --accent-ink: #0b2e12; --accent-text: #d3e2cc; --accent-soft: #1d3d1f;
  --ok: #74d29d; --ok-soft: #1a3526; --warn: #efe6cf; --warn-soft: #4a3c14; --bad: #f19a92; --bad-soft: #3c2220;
  --info: #8fb6ea; --info-soft: #1d2b3e; --hold-standing: #34413c; --hold-booking: #3f5a4f; --hold-request: #d4af37; --src1: #3987e5; --src2: #d95926; --src3: #199e70;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent-text); }
.mono { font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: #0b2e12; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: #0b2e12; color: var(--cream); border-bottom: 2px solid var(--gold); }
.top-inner { display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { font-family: var(--font-display); font-style: italic; font-weight: 500; letter-spacing: -0.01em; font-size: 18px; color: var(--cream); display: flex; align-items: center; gap: 8px; }
.brand .mark { height: 42px; width: auto; display: block; }
.demo-tag { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #0b2e12; background: var(--gold-light); padding: 2px 8px; border-radius: 999px; }
.spacer { flex: 1; }
.who { display: flex; align-items: center; gap: 8px; min-width: 0; }
.who label { font-size: 12px; color: var(--cream); opacity: .85; }
.who select { background: #123a1a; color: var(--cream); border: 1px solid rgba(212,175,55,.5); border-radius: 6px; padding: 6px 8px; max-width: 260px; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 12px; cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--ink-3); }
.top > .top-inner > .btn { background: transparent; color: var(--cream); border-color: rgba(212,175,55,.5); }
.top > .top-inner > .btn:hover { border-color: var(--gold); color: var(--gold-light); }
#topSearch input { background: #123a1a; color: var(--cream); border: 1px solid rgba(212,175,55,.5); border-radius: 6px; padding: 6px 10px; width: 200px; max-width: 100%; }
#topSearch input::placeholder { color: var(--cream); opacity: .6; }
.top .count { background: var(--gold); color: #0b2e12; }
@media (max-width: 720px) { #topSearch { order: 5; flex-basis: 100%; } #topSearch input { width: 100%; } }
.btn.primary { background: var(--accent); border-color: var(--gold); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); }
.btn.small { padding: 4px 9px; font-size: 13px; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }

.shell { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: calc(100vh - 56px); }
.rail { border-right: 1px solid var(--line); background: var(--surface); padding: 16px 10px; display: flex; flex-direction: column; gap: 2px; }
.rail .group { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-3); padding: 14px 10px 6px; }
.rail button { text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--ink-2); }
.rail button:hover { background: var(--surface-2); color: var(--ink); }
.rail button.on { background: var(--accent-soft); color: var(--accent-text); box-shadow: inset 3px 0 0 var(--gold); }
.rail .count { font-family: var(--mono); font-size: 11px; background: var(--warn-soft); color: var(--warn); border-radius: 999px; padding: 0 7px; }
.rail .soon { font-size: 10.5px; color: var(--ink-3); }
.main { min-width: 0; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.main-inner { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

h1 { font-family: var(--font-display); font-style: italic; font-weight: 500; font-size: 28px; letter-spacing: -0.01em; margin: 0; text-wrap: balance; line-height: 1.25; }
h2 { font-size: 15px; margin: 0; }
h3 { font-size: 14px; margin: 0; }
.lead { color: var(--ink-2); margin: 4px 0 0; max-width: 68ch; }
.head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.crumb { font-size: 12.5px; color: var(--ink-2); }
.crumb button { border: 0; background: none; color: var(--accent-text); cursor: pointer; padding: 0; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.panel-h { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.panel-b { padding: 16px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.muted { color: var(--ink-2); }
.small { font-size: 12.5px; }

.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.tile { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
.tile:hover { border-color: var(--gold); }
.tile.locked { opacity: .65; cursor: default; background: var(--surface-2); }
.tile.locked:hover { border-color: var(--line); }
.lk { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; color: var(--accent-text); font: inherit; font-weight: 600; }
.tile p { margin: 0; color: var(--ink-2); font-size: 13px; }
.tile .foot { margin-top: auto; padding-top: 6px; }

.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 1px 9px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--info-soft); color: var(--info); }
.pill.accent { background: var(--accent-soft); color: var(--accent-text); }

.list { display: flex; flex-direction: column; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; padding: 12px 16px; border-top: 1px solid var(--line); align-items: center; text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; cursor: pointer; }
.item:first-child { border-top: 0; }
.item:hover { background: var(--surface-2); }
.item .t { font-weight: 600; }
.item .s { color: var(--ink-2); font-size: 12.5px; }
.item .r { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.empty { padding: 28px 16px; text-align: center; color: var(--ink-2); }

.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); font-weight: 600; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 12px; border-top: 1px solid var(--line); vertical-align: top; }
td.mono { white-space: nowrap; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

form.f { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
.fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fld.wide { grid-column: 1 / -1; }
.fld > label, .fld > .lbl { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.fld input[type=text], .fld input[type=email], .fld input[type=url], .fld input[type=number], .fld input[type=date], .fld input[type=time], .fld select, .fld textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; width: 100%; min-width: 0;
}
.fld textarea { min-height: 64px; resize: vertical; }
.checks-inline { display: flex; flex-wrap: wrap; gap: 6px 16px; }
.checks-inline label { display: flex; gap: 6px; align-items: center; font-size: 13.5px; font-weight: 400; color: var(--ink); }
.hint { font-size: 12px; color: var(--ink-3); }
.sect { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
.sect > .sect-h { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 2px; }
.ex { font-size: 12px; color: var(--ink-2); background: var(--surface-2); border-radius: 6px; padding: 6px 8px; white-space: pre-wrap; }
.actions { grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }

.checks { display: flex; flex-direction: column; }
.check { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; padding: 9px 0; border-top: 1px solid var(--line); }
.check:first-child { border-top: 0; padding-top: 0; }
.check .ic { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; margin-top: 1px; }
.check.ok .ic { background: var(--ok-soft); color: var(--ok); }
.check.warn .ic { background: var(--warn-soft); color: var(--warn); }
.check.bad .ic { background: var(--bad-soft); color: var(--bad); }
.check.info .ic { background: var(--info-soft); color: var(--info); }
.check .rule { font-size: 11.5px; color: var(--ink-3); }

.tl { position: relative; height: 34px; background: var(--surface-2); border-radius: 6px; overflow: hidden; }
.tl .blk { position: absolute; top: 4px; bottom: 4px; border-radius: 4px; font-size: 10.5px; padding: 0 5px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; line-height: 26px; color: var(--ink); }
.tl .blk.standing { background: var(--hold-standing); }
.tl .blk.booking, .tl .blk.tentative { background: var(--hold-booking); }
.tl .blk.tentative { background-image: repeating-linear-gradient(135deg, transparent 0 5px, rgba(255,255,255,0.25) 5px 10px); }
.tl .blk.req { background: transparent; border: 2px solid var(--hold-request); color: var(--hold-request); font-weight: 600; z-index: 2; }
.tl-axis { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); margin-top: 3px; }
.btabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.btabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; cursor: pointer; font-weight: 500; color: var(--ink-2); margin-bottom: -1px; }
.btabs button.on { color: var(--ink); border-bottom-color: var(--gold); box-shadow: inset 0 -1px 0 var(--gold); }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
.pace { display: grid; grid-template-columns: minmax(120px, 170px) minmax(80px, 1fr) minmax(150px, 200px); gap: 10px; align-items: center; padding: 5px 0; }
.pbar { position: relative; height: 10px; background: var(--surface-2); border-radius: 5px; }
.pbar .sp, .pbar .cm { position: absolute; top: 0; bottom: 0; }
.pbar .sp { left: 0; background: var(--ink-2); border-radius: 5px 0 0 5px; }
.pbar .cm { background: var(--ink-3); opacity: 0.5; }
.pbar .tick { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--accent); }
@media (max-width: 720px) { .pace { grid-template-columns: 1fr; gap: 3px; } }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11.5px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }

.stages { display: flex; gap: 0; overflow-x: auto; padding-bottom: 2px; }
.stage { flex: 1 0 84px; display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--ink-3); }
.stage .bar { height: 4px; background: var(--line); margin-right: 3px; border-radius: 2px; }
.stage.done .bar { background: var(--accent); }
.stage.now .bar { background: var(--warn); }
.stage.now { color: var(--ink); font-weight: 600; }
.stage.done { color: var(--ink-2); }
.stage.skip { opacity: 0.45; }

.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; font-size: 13.5px; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
/* Question-and-answer lists: the question sits above its answer, so long questions never squeeze the answer. */
.kv.stacked { grid-template-columns: minmax(0, 1fr); gap: 2px; }
.kv.stacked dd { margin-bottom: 10px; }
.kv.stacked dd:last-child { margin-bottom: 0; }

.task { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 10px 0; border-top: 1px solid var(--line); align-items: center; }
.task:first-child { border-top: 0; padding-top: 0; }
.log { font-size: 12.5px; display: flex; flex-direction: column; gap: 6px; }
.log .when { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); margin-right: 6px; }
.note { border-radius: 6px; padding: 10px 12px; font-size: 13px; }
.note.warn { background: var(--warn-soft); color: var(--warn); }
.note.info { background: var(--info-soft); color: var(--info); }
.note.ok { background: var(--ok-soft); color: var(--ok); }

.board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.col { background: var(--surface-2); border-radius: var(--r); padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 120px; }
.col h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); display: flex; justify-content: space-between; }
.tcard { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }

.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; }
.sheet-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; border-bottom: 2px solid var(--ink); padding-bottom: 8px; margin-bottom: 4px; }
.sheet-h h2 { font-size: 18px; }
.sheet td { font-size: 13px; }
.flag { color: var(--bad); font-weight: 600; }

.lines td { padding: 6px; }
.lines input, .lines select { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; min-width: 0; }
.lines .amt { width: 110px; text-align: right; }
.lines.card-lines { min-width: 760px; }
.lines.card-lines input[type=date] { min-width: 140px; }
.lines.card-lines [data-k=merchant] { min-width: 150px; }
.lines.card-lines [data-k=acct] { min-width: 190px; }
.lines.card-lines [data-k=amount] { width: 96px; }
.lines.card-lines [data-k=flag], .lines.card-lines [data-k=repayBy] { min-width: 150px; }

.toggle { position: relative; width: 34px; height: 20px; flex: none; }
.toggle input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; cursor: pointer; }
.toggle span { position: absolute; inset: 0; background: var(--line); border-radius: 999px; pointer-events: none; transition: background .15s; }
.toggle span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); transition: transform .15s; }
.toggle input:checked + span { background: var(--accent); }
.toggle input:checked + span::after { transform: translateX(14px); }

.guide { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 57px); right: 0; bottom: 0; width: min(380px, 100vw); background: var(--surface); border-left: 1px solid var(--line); z-index: 6; display: flex; flex-direction: column; box-shadow: -8px 0 24px rgba(0,0,0,0.08); padding-right: env(safe-area-inset-right, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.guide[hidden], [hidden] { display: none !important; }
.guide-h { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
.guide-b { overflow-y: auto; padding: 8px 16px 24px; display: flex; flex-direction: column; }
.step { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); }
.step:first-child { border-top: 0; }
.step .n { width: 24px; height: 24px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-family: var(--mono); font-size: 12px; font-weight: 500; }
.step.cur .n { background: var(--accent); color: var(--accent-ink); }
.step p { margin: 4px 0 8px; color: var(--ink-2); font-size: 13px; }
.step .as { font-size: 12px; color: var(--ink-3); }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-size: 13.5px; z-index: 20; max-width: calc(100vw - 32px); }

@media (min-width: 1200px) { body.guide-open .shell { margin-right: 380px; } }
.sankey { width: 100%; min-width: 640px; height: auto; display: block; }
.sankey text { paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.sankey .sk-l { font-size: 12px; fill: var(--ink); font-weight: 600; }
.sankey .sk-v { font-size: 11px; fill: var(--ink-2); font-family: var(--mono); }
.sankey .lnk:hover { fill-opacity: 0.6; }
.tip { position: fixed; z-index: 30; background: var(--ink); color: var(--bg); font-size: 12.5px; padding: 6px 9px; border-radius: 6px; pointer-events: none; max-width: 280px; }
.public-wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

/* IT & Maintenance tracker */
.main-inner.wide { max-width: 1320px; }
.btabs.tkt { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.btabs.tkt.small { border-bottom: 0; }
.btabs.tkt button { white-space: nowrap; }
select, input[type=search], input[type=date], input[type=number], input[type=text].mini { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; min-width: 0; max-width: 100%; }

<script>
"use strict";
/* ------------------------------------------------------------------ */
/* Dates and times                                                     */
/* ------------------------------------------------------------------ */
const pad = (n) => String(n).padStart(2, "0");
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseD = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d, 12); };
const TODAY = ymd(new Date());
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); };
const dow = (s) => parseD(s).getDay();
const daysBetween = (a, b) => Math.round((parseD(b) - parseD(a)) / 864e5);
const nextDow = (from, target, minDays) => { let d = addDays(from, minDays); while (dow(d) !== target) d = addDays(d, 1); return d; };
const addMonths = (s, n) => { const d = parseD(s), day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n); d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate())); return ymd(d); };

/* Recurring reservations. A series always has an end date: start plus a fixed term. */
const RECUR_FREQ = { weekly: "Every week", biweekly: "Every 2 weeks", monthly: "Monthly, same weekday" };
const recurEnd = (start, months) => addDays(addMonths(start, Number(months)), -1);
const mkRecur = (freq, start, end) => ({ freq, start, end });
const recurMax = (start) => recurEnd(start, POLICY.maxMonths);

function occursOn(x, date) {
  const r = x.recur; if (!r) return x.date === date;
  if (date < r.start || (r.end && date > r.end)) return false;
  const d = dow(date);
  if (r.dows ? !r.dows.includes(d) : d !== dow(r.start)) return false;

  if (r.freq === "monthly") return week(date) === (r.nth || week(r.start));

  return true;

/* Search: request numbers or words, limited to what the person could open anyway. */
function canSeeCard(c) {
  if (c.kind === "po") {
    if (c.owner === S.me || c.approver === S.me) return true;
    if (restrictedPO(c)) return has("sw") || has("finance");
    return has("finance") || has("office") || has("executive") || canChair(S.me, c) || directsOf(S.me).includes(c.committee) || Boolean(chairStepAs(c));
  }
  if (c.kind === "event") return c.owner === S.me || has("office") || has("executive") || me().committees.includes(c.committee) || directsOf(S.me).includes(c.committee) || c.tasks.some((t) => has(TEAM_ROLE[t.team]) && t.status !== "locked");
  if (c.kind === "rental") return has("office");
  if (c.kind === "mkt") return canSeeMK(c);
  return false;
}
function searchCards(q) {
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  if (!words.length) return [];
  const hay = (c) => [c.id, c.title, c.desc, c.org, c.committee, c.payee, nameOf(c.owner || ""), ...(c.lines || []).flatMap((l) => [l.merchant, l.acct, l.note]), ...Object.values(c.answers || {})].filter(Boolean).join(" ").toLowerCase();
  return [...S.cards, ...S.pos, ...S.mreqs, ...S.rentals].filter((c) => canSeeCard(c) && words.every((w) => hay(c).includes(w)));
}
function vSearch() {
  const q = S.arg || "";
  const hits = searchCards(q);
  return `<div><h1>Search</h1><p class="lead">Find a request by its number (11046, PO-11046) or by words in it. You only see requests you could open anyway.</p></div>
  <form id="srchForm" class="row"><input type="search" name="q" class="srch wide" value="${esc(q)}" placeholder="Request number, or words from the title, payee or committee" aria-label="Search requests"><button class="btn primary" type="submit">Search</button></form>
  ${q ? `<div class="panel"><div class="panel-h"><h2>${hits.length} result${hits.length === 1 ? "" : "s"}</h2></div>${hits.length ? `<div class="list">${hits.map((c) => itemRow(c, waitingOn(c))).join("")}</div>` : `<div class="empty">Nothing matches “${esc(q)}” among requests you can open.</div>`}</div>` : ""}`;
}

function saveAway(f) {
  const from = f.from.value < TODAY ? TODAY : f.from.value, until = f.until.value, to = f.delegate.value;

  if (until < TODAY) return toast("The last day can't be in the past.");
  if (until < from) return toast("The last day must be on or after the first day.");
  if (daysBetween(from, until) + 1 > 120) return toast("Keep it to 120 days or less.");
  if (!to) return toast("Choose who will cover your approvals.");
  const theirs = S.away[to];
  if (theirs && theirs.from <= until && from <= theirs.until) return toast(`${nameOf(to)} is away during those dates too. Choose someone else.`);
  const before = S.away[S.me];
  S.away[S.me] = { from, until, delegate: to, note: f.note.value.trim() };

}

function calendarPicker() {
  const d = S.calDate || nextDow(TODAY, 6, 8), r = S.calRoom || "mphAB";

    <div id="calOut">${timeline(d, r, null)}</div>`;

function timeline(date, roomId, req) {
  const S0 = 7 * 60, S1 = 23 * 60, span = S1 - S0;
  const pos = (m) => ((Math.max(S0, Math.min(S1, m)) - S0) / span) * 100;
  const hs = roomId === "offsite" ? [] : holdsOn(date, req?.id).filter((h) => roomsOverlap(h.room, roomId));

const DESC_GOOD = 200;
const descHint = (t) => { const n = String(t || "").trim().length; return n >= DESC_GOOD ? `${n} characters. That gives reviewers and the teams what they need.` : `${n} characters. A few sentences, ${DESC_GOOD}+ characters, helps the office approve faster and the teams plan: what happens, who it's for, the schedule, speakers or guests, and what you need.`; };
const checksHtml = (ch) => ch.map((c) => `<div class="check ${c.sev}"><span class="ic">${{ ok: "✓", warn: "!", bad: "×", info: "i" }[c.sev]}</span><div>${esc(c.text)}${c.rule ? `<div class="rule">${esc(c.rule)}</div>` : ""}</div></div>`).join("");

function submitEvent() {
  readDraft();
  const d = S.draft;
  const ch = runChecks(d, S.me);
  const blocked = ch.find((x) => x.block);
  if (blocked) return toast(blocked.text);
  const mission = ruleOn("mission") && missionReasons(d).length > 0;
  let c, prevStatus = null;
  if (d.id) {
    c = getCard(d.id);
    prevStatus = c.status;
    Object.assign(c, JSON.parse(JSON.stringify(d)), { kind: "event" });
    c.status = mission ? "mission" : "office";
    c.recur = recurOf(d);
    c.tasks = buildTasks(c, {});
    log(c, "Updated and resubmitted");
  } else {
    c = ev({ ...JSON.parse(JSON.stringify(d)), id: "EV-" + ++S.seq.EV, owner: S.me, status: mission ? "mission" : "office", created: TODAY });
    c.recur = recurOf(d);
    log(c, c.recur ? `Submitted as a series: ${recurText(c.recur)}, ${fmtLong(c.recur.start)} to ${fmtLong(c.recur.end)}` : "Submitted");
    S.cards.unshift(c);
    if (d.renews) { const prior = getCard(d.renews); prior.renewedBy = c.id; log(prior, `Renewal requested: ${c.id}`); }
  }
  const flagged = ch.filter((x) => x.sev === "bad" || x.sev === "warn").length;
  c.log.push({ t: TODAY, who: "system", text: flagged ? `Auto checks: ${flagged} flag${flagged > 1 ? "s" : ""} for the office to review` : "Auto checks passed. Room held on the IAR calendar (tentative)" });
  if (mission) c.log.push({ t: TODAY, who: "system", text: "Mission review needed: " + missionReasons(c).join(", ") });
  S.draft = null;
  evNotify(c, prevStatus);
  toast(`${c.id} submitted. ${mission ? "Sent for mission review." : "Sent to the IAR office."}`);
  go("card", c.id);
}

function vPOCard(c) {

function mkAction(a) {
  const r = getCard(S.arg), prev = r.status, note = (document.getElementById("mkNote")?.value || "").trim();
  if (a === "reply") { if (r.owner !== S.me) return; if (!note) return toast("Write your answer first."); r.status = "submitted"; log(r, "Answered: " + note); toast("Sent back to marketing"); }
  else if (!has("marketing")) return toast("This step is for the marketing team.");
  else if (a === "schedule") { r.doneBy = document.getElementById("mkDoneBy").value || addDays(TODAY, 14); r.status = "scheduled"; log(r, `Scheduled at the weekly review, to finish by ${fmtLong(r.doneBy)}` + (note ? `. ${note}` : "")); toast(`Scheduled. ${nameOf(r.owner)} is notified.`); }
  else if (a === "ask") { r.status = "changes"; log(r, "Question: " + (note || "Can you share more details?")); toast("Question sent to " + nameOf(r.owner)); }
  else if (a === "decline") { r.status = "declined"; log(r, "Declined" + (note ? `: ${note}` : "")); toast("Declined. " + nameOf(r.owner) + " is emailed."); }
  else if (a === "start") { r.status = "doing"; log(r, "Started" + (note ? `: ${note}` : "")); toast("Started"); }
  else if (a === "done") { r.status = "done"; log(r, "Done" + (note ? `: ${note}` : "")); toast("Done. " + nameOf(r.owner) + " is notified."); }
  mkNotify(r, prev);
  render();
}

const SRC = { gf: { label: "Unrestricted · General Fund", color: "var(--src1)" }, prog: { label: "Restricted · Programs", color: "var(--src2)" }, don: { label: "Restricted · Donations", color: "var(--src3)" } };

function sankeySvg(cols, links, opts) {
  const W = 960, H = opts.h || 460, nw = 14, top = 16;
  const padOf = (c) => (c.length > 14 ? 14 : c.length > 6 ? 26 : 16);
  const val = {};
  for (const l of links) { val["o" + l.s] = (val["o" + l.s] || 0) + l.v; val["i" + l.t] = (val["i" + l.t] || 0) + l.v; }
  const nodeV = (id) => Math.max(val["o" + id] || 0, val["i" + id] || 0);
  const colX = cols.map((_, i) => 215 + i * ((W - 215 - 200) / (cols.length - 1)));
  const scale = Math.min(...cols.map((c) => (H - top * 2 - padOf(c) * (c.length - 1)) / c.reduce((a, n) => a + nodeV(n.id), 0)));
  const pos = {};
  cols.forEach((c, ci) => { const pad = padOf(c); let y = top; const tot = c.reduce((a, n) => a + nodeV(n.id), 0) * scale + pad * (c.length - 1); y = (H - tot) / 2; for (const n of c) { const h = Math.max(2, nodeV(n.id) * scale); pos[n.id] = { x: colX[ci], y, h, out: y, in: y, ci, n }; y += h + pad; } });
  let paths = "";
  for (const l of links) {
    const a = pos[l.s], b = pos[l.t]; if (!a || !b) continue; const th = Math.max(1, l.v * scale);
    const x0 = a.x + nw, x1 = b.x, xm = (x0 + x1) / 2, y0 = a.out, y1 = b.in; a.out += th; b.in += th;
    paths += `<path d="M${x0},${y0} C${xm},${y0} ${xm},${y1} ${x1},${y1} L${x1},${y1 + th} C${xm},${y1 + th} ${xm},${y0 + th} ${x0},${y0 + th} Z" fill="${l.color}" fill-opacity="0.38" class="lnk" data-tip="${esc(l.tip)}"/>`;
  }
  let nodes = "";
  for (const p of Object.values(pos)) {
    const left = p.ci === 0, last = p.ci === cols.length - 1;
    const tx = left ? p.x - 8 : p.x + nw + 8, anchor = left ? "end" : "start";
    nodes += `<rect x="${p.x}" y="${p.y}" width="${nw}" height="${p.h}" rx="3" fill="${p.n.color || "var(--ink-2)"}" data-tip="${esc(p.n.label + ": " + money(nodeV(p.n.id)))}"/>`;
    const vtxt = kfmt(nodeV(p.n.id)) + (last && opts.total ? ` · ${Math.round((nodeV(p.n.id) / opts.total) * 100)}%` : "");
    if (left || p.h >= 30) nodes += `<text x="${tx}" y="${p.y + p.h / 2 - 1}" text-anchor="${anchor}" class="sk-l">${esc(p.n.label)}</text><text x="${tx}" y="${p.y + p.h / 2 + 12}" text-anchor="${anchor}" class="sk-v">${vtxt}</text>`;
    else nodes += `<text x="${tx}" y="${p.y + p.h / 2 + 4}" text-anchor="${anchor}" class="sk-l">${esc(p.n.label)} <tspan class="sk-v">${vtxt}</tspan></text>`;
  }
  return `<div class="tablewrap"><svg class="sankey" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria)}">${paths}${nodes}</svg></div>`;
}
const kfmt = (n) => (n >= 1e6 ? "$" + (n / 1e6).toFixed(2) + "M" : n >= 1e3 ? "$" + Math.round(n / 1e3) + "K" : "$" + Math.round(n));

/* ---- Shura / Board: how IAR is doing, across every module ---- */
/* Maintenance and IT cases by kind. Sub-tasks count through their parent. */
const CASE_KIND = { repair: "Repairs", preventive: "Preventive", improve: "Improvements" }; // new things and projects
const caseKind = (t) => (t.itype === "Preventive" ? "preventive" : t.itype === "Problem" ? "repair" : "improve");
function orgHealth(days = 30) {
  const end = addDays(TODAY, days), since = addDays(TODAY, -days);
  const window = (c) => { const out = []; for (let d = TODAY; d <= end; d = addDays(d, 1)) if (occursOn(c, d)) out.push(d); return out; };
  const evLive = S.cards.filter((c) => ["approved", "closeout"].includes(c.status)).map((c) => ({ c, dates: window(c) })).filter((x) => x.dates.length);
  const evPending = S.cards.filter((c) => ["submitted", "office", "mission", "changes"].includes(c.status));
  const rentals = S.rentals.filter((r) => r.status === "approved" && r.date >= TODAY && r.date <= end);
  const cases = (team) => {
    const ts = S.tickets.filter((t) => tkTeam(t) === team && t.itype !== "Sub-task");
    const open = ts.filter((t) => !isDone(t));
    const by = Object.fromEntries(Object.keys(CASE_KIND).map((k) => [k, open.filter((t) => caseKind(t) === k).length]));
    return {
      open, by, overdue: open.filter(tkOverdue).length,
      late: open.filter((t) => tkHasSla(t) && tkSla(t).res.state === "breach").length,
      urgent: open.filter((t) => ["Highest", "High"].includes(t.priority)).length,
      closed: ts.filter((t) => t.resolvedAt && t.resolvedAt.slice(0, 10) >= since).length,
      pmLate: S.tkx.schedules.filter((s) => s.on && s.team === team && s.next < TODAY).length,
      pmAll: S.tkx.schedules.filter((s) => s.on && s.team === team).length,
      projects: open.filter((t) => t.itype === "Epic"),
    };
  };
  const poOpen = S.pos.filter((p) => ["chair", "finance", "to_pay", "books", "returned"].includes(p.status));
  return {
    days, evLive, evPending, rentals,
    evCount: evLive.reduce((a, x) => a + x.dates.length, 0) + rentals.length,
    people: evLive.reduce((a, x) => a + x.dates.length * (x.c.attendance || 0), 0) + rentals.reduce((a, r) => a + (r.attendance || 0), 0),
    closeout: S.cards.filter((c) => c.status === "closeout"),
    fac: cases("facilities"), it: cases("it"),
    poOpen, poAmt: poOpen.reduce((a, p) => a + total(p), 0), poSlow: poOpen.filter((p) => daysBetween(p.created, TODAY) > 7),
    rnPending: S.rentals.filter((r) => r.status === "submitted"),
    aid: { n: S.aid.length, amt: S.aid.reduce((a, x) => a + x.amount, 0), waiting: S.aid.filter((x) => /awaiting/i.test(x.status)).length },
    assets: { repair: S.assets.filter((a) => a.status === "Needs repair"), warranty: S.assets.filter((a) => a.warranty && a.warranty >= TODAY && a.warranty <= addDays(TODAY, 90)) },
    policies: S.lib.files.filter((f) => f.drive === "policies" && f.review && f.review < TODAY && f.folder !== "Archive"),
    drafts: S.lib.files.filter((f) => f.drive === "policies" && f.folder === "Drafts"),
    minutes: S.lib.files.filter((f) => f.drive === "shura" && f.folder === "Minutes").sort((a, b) => (a.updated < b.updated ? 1 : -1))[0],
    meeting: S.bookings.filter((b) => /shura/i.test(b.label) && b.date >= TODAY).sort((a, b) => (a.date > b.date ? 1 : -1))[0],
  };
}
function vShura() {
  const H = orgHealth(), pace = yearPace();
  const all = S.budget.flatMap((c) => c.lines), sum = (xs, k) => xs.reduce((a, x) => a + x[k], 0);
  const B = sum(all, "budget"), SP = sum(all, "spent"), CM = sum(all, "committed");
  const recGf = revSum((r) => r.kind === "gf"), R = revSum(() => true);
  const gfL = all.filter((l) => l.source === "gf"), gfAfter = recGf - sum(gfL, "spent") - sum(gfL, "committed");
  const ahead = S.budget.filter((c) => (sum(c.lines, "spent") + sum(c.lines, "committed")) / sum(c.lines, "budget") > pace + 0.05);
  const openSR = S.shReq.filter((r) => r.status === "open");
  const sgn = (v) => (v < 0 ? "−" : "+") + kfmt(Math.abs(v));
  const flag = (n, label, cls = "warn") => (n ? `<span class="pill ${cls}">${n} ${label}</span>` : "");
  const tile = (label, val, sub, go, extra) => `<button class="tile" type="button" ${go ? `data-go="${go}"` : "disabled"} style="text-align:left"><div class="small muted">${label}</div><div style="font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;margin:2px 0">${val}</div><div class="small muted">${sub}</div>${extra ? `<div class="row" style="gap:4px;margin-top:6px">${extra}</div>` : ""}</button>`;
  const kinds = (c) => Object.entries(CASE_KIND).map(([k, l]) => `${c.by[k]} ${l.toLowerCase()}`).join(" · ");
  const caseRow = (name, c) => `<tr><td><strong>${name}</strong></td>${Object.keys(CASE_KIND).map((k) => `<td class="num">${c.by[k]}</td>`).join("")}<td class="num"><strong>${c.open.length}</strong></td><td class="num">${c.urgent}</td><td class="num">${c.overdue + c.late ? `<span class="pill bad">${c.overdue + c.late}</span>` : "0"}</td><td class="num">${c.closed}</td><td class="num">${c.pmAll - c.pmLate} of ${c.pmAll}</td></tr>`;
  /* Decisions and follow-ups that sit with the Shura or its officers. */

/* ------------------------------------------------------------------ */
/* IT & Maintenance: a Jira-style issue tracker                         */
/* Workflow, board, list + JQL, backlog + sprints, epics, sub-tasks,    */
/* links, SLAs, work logs, watchers, notifications, automation,         */
/* preventive-maintenance schedules, reports and project settings.      */
/* ------------------------------------------------------------------ */
const tsOf = (d) => `${ymd(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const tsNow = () => tsOf(new Date());
const hoursAgo = (h) => tsOf(new Date(Date.now() - h * 36e5));
const tsMs = (s) => new Date(s.length === 10 ? s + "T12:00" : s).getTime();
const fmtTs = (s) => { if (!s) return "—"; const d = new Date(tsMs(s)); const h = d.getHours() % 12 || 12; return `${MON[d.getMonth()]} ${d.getDate()}, ${h}:${pad(d.getMinutes())} ${d.getHours() >= 12 ? "PM" : "AM"}`; };
const ago = (s) => { const m = Math.max(0, Math.round((Date.now() - tsMs(s)) / 6e4)); if (m < 2) return "just now"; if (m < 90) return m + "m ago"; if (m < 36 * 60) return Math.round(m / 60) + "h ago"; return Math.round(m / 1440) + "d ago"; };
const fmtH = (h) => { h = Math.abs(h); if (h < 1) return Math.max(1, Math.round(h * 60)) + "m"; if (h < 48) return (Math.round(h * 10) / 10) + "h"; return Math.round(h / 24) + "d"; };
const initials = (id) => (nameOf(id).replace(/^Dr\. /, "").split(/\s+/).map((w) => w[0]).slice(0, 2).join("") || "?").toUpperCase();

const TK_PRI = ["Highest", "High", "Medium", "Low", "Lowest"];
const TK_PRI_ICON = { Highest: ["▲▲", "bad"], High: ["▲", "bad"], Medium: ["◆", "warn"], Low: ["▼", "info"], Lowest: ["▼▼", "info"] };
const TK_SLA = { Highest: [2, 24], High: [8, 72], Medium: [24, 168], Low: [72, 336], Lowest: [168, 720] }; // hours to first response, hours to resolve
const TK_TYPES = { Problem: ["!", "bad"], Request: ["?", "info"], Task: ["✓", "accent"], Preventive: ["⟳", "ok"], Epic: ["⚡", "warn"], "Sub-task": ["↳", "info"] };
const TK_RESOLUTIONS = ["Fixed", "Done", "Won't fix", "Duplicate", "Cannot reproduce", "Withdrawn by reporter"];
const TK_ST = {
  open: { n: "Open", c: "todo", cls: "info" }, reopened: { n: "Reopened", c: "todo", cls: "bad" },
  inprogress: { n: "In Progress", c: "prog", cls: "warn" }, waiting: { n: "Waiting", c: "prog", cls: "warn" }, review: { n: "In Review", c: "prog", cls: "accent" },
  resolved: { n: "Resolved", c: "done", cls: "ok" }, closed: { n: "Closed", c: "done", cls: "ok" },
};
const TK_FLOW = { open: ["inprogress", "waiting", "resolved", "closed"], reopened: ["inprogress", "waiting", "resolved", "closed"], inprogress: ["open", "waiting", "review", "resolved"], waiting: ["inprogress", "resolved", "closed"], review: ["inprogress", "resolved"], resolved: ["closed", "reopened"], closed: ["reopened"] };
const TK_TRANS = { open: "Back to Open", inprogress: "Start progress", waiting: "Waiting on parts or vendor", review: "Send for review", resolved: "Resolve", closed: "Close", reopened: "Reopen" };
const TK_COLS = [{ id: "open", n: "Open", sts: ["open", "reopened"] }, { id: "inprogress", n: "In Progress", sts: ["inprogress"] }, { id: "waiting", n: "Waiting", sts: ["waiting"] }, { id: "review", n: "In Review", sts: ["review"] }, { id: "done", n: "Done", sts: ["resolved", "closed"] }];
const TK_INV = { blocks: "is blocked by", "is blocked by": "blocks", duplicates: "is duplicated by", "is duplicated by": "duplicates", "relates to": "relates to", causes: "is caused by", "is caused by": "causes" };
const TK_TEAM = { it: { name: "IT" }, facilities: { name: "Maintenance" } };
const TK_FREQ = { weekly: 7, monthly: 30, quarterly: 91, "every 6 months": 182, yearly: 365 };

const catOf = (t) => TK_ST[t.status].c;
const isDone = (t) => catOf(t) === "done";
const tkTeam = (t) => (t.type === "it" ? "it" : "facilities");
const canWorkTk = (t) => has(tkTeam(t));
const anyWorker = () => has("it") || has("facilities");
const myTeams = () => ["it", "facilities"].filter(has);
const canSeeTk = (t) => canWorkTk(t) || t.owner === S.me || (t.watchers || []).includes(S.me);
const tkGet = (id) => S.tickets.find((t) => t.id === id);
const tkPeople = (team) => Object.entries(PEOPLE).filter(([k, p]) => k !== "admin" && p.roles.includes(team)).map(([k]) => k);
const tkKids = (t) => S.tickets.filter((x) => x.parent === t.id);
const tkEpicKids = (t) => S.tickets.filter((x) => x.epic === t.id);
const roomName = (id) => (id === "office" ? "Admin office" : id === "parking" ? "Parking lot / outside" : id ? room(id).name : "—");
const tkSprint = (id) => (S.tkx.sprints.find((s) => s.id === id));
const tkBlocked = (t) => !isDone(t) && (t.links || []).some((l) => l.rel === "is blocked by" && tkGet(l.id) && !isDone(tkGet(l.id)));
const tkOverdue = (t) => !!t.due && !isDone(t) && t.due < TODAY;

/* ---- SLA: calendar hours; the resolution clock pauses while Waiting ---- */
function tkSla(t) {
  const [rh, xh] = TK_SLA[t.priority] || TK_SLA.Medium, born = tsMs(t.created), now = Date.now();
  const resp = (() => {
    const due = born + rh * 36e5;
    if (t.firstResponse) { const at = tsMs(t.firstResponse); return { state: at <= due ? "met" : "breach", text: at <= due ? "Responded in time" : "Responded late" }; }
    const left = (due - now) / 36e5;
    return { state: left < 0 ? "breach" : left < rh * 0.25 ? "warn" : "ok", text: left < 0 ? `Response overdue ${fmtH(left)}` : `Respond within ${fmtH(left)}` };
  })();
  const end = t.resolvedAt ? tsMs(t.resolvedAt) : now;
  const paused = (t.paused || 0) + (t.pausedAt ? end - tsMs(t.pausedAt) : 0);
  const used = (end - born - paused) / 36e5, left = xh - used;
  const res = t.resolvedAt ? { state: used <= xh ? "met" : "breach", text: used <= xh ? "Resolved in time" : "Resolved late" }
    : t.pausedAt ? { state: "paused", text: `Paused · ${fmtH(left)} left` }
    : { state: left < 0 ? "breach" : left < xh * 0.25 ? "warn" : "ok", text: left < 0 ? `Resolution overdue ${fmtH(left)}` : `${fmtH(left)} left to resolve` };
  return { resp, res, used, target: xh };
}
const tkHasSla = (t) => t.itype === "Problem" || t.itype === "Request";
const slaPill = (s) => `<span class="pill ${({ met: "ok", ok: "ok", warn: "warn", breach: "bad", paused: "" })[s.state]}">${esc(s.text)}</span>`;

/* ---- history, notifications, mutation helpers ---- */
function tkLog(t, e) { const at = tsNow(); t.log.push({ t: at, who: S.me, ...e }); t.updated = at; }
function tkNotify(t, text, opts = {}) {
  const to = new Set([t.owner, t.assignee, ...(t.watchers || []), ...(opts.also || [])].filter(Boolean));
  to.delete(S.me);
  for (const u of to) { if (!PEOPLE[u] || (opts.internal && !canWorkTkFor(u, t))) continue; S.tkx.notifs.unshift({ id: ++S.tkx.seq.N, to: u, t: tsNow(), ticket: t.id, text, read: false, by: S.me }); }
}
const canWorkTkFor = (u, t) => PEOPLE[u].roles.includes(tkTeam(t));
function tkWatch(t, u) { t.watchers = t.watchers || []; if (u && u !== "system" && !t.watchers.includes(u)) t.watchers.push(u); }
function tkFirstResponse(t) { if (!t.firstResponse && S.me !== t.owner && canWorkTk(t)) t.firstResponse = tsNow(); }
function tkNextId() { return "TK-" + ++S.seq.TK; }
function tkNew(o) {
  const at = tsNow();
  const t = Object.assign({ itype: "Problem", priority: "Medium", labels: [], comps: [], watchers: [], links: [], attach: [], assignee: "", resolution: "", room: "office", asset: "", due: "", est: 0, spent: 0, cost: 0, vendor: "", sprint: "", epic: "", parent: "", status: "open", flagged: false, created: at, updated: at, log: [], paused: 0 }, o);
  if (!t.id) t.id = tkNextId();
  t.log.push({ t: t.created, who: t.owner, k: "created" });
  tkWatch(t, t.owner); tkWatch(t, t.assignee);
  return t;
}
const TK_FIELD_LABEL = { assignee: "Assignee", priority: "Priority", title: "Summary", desc: "Description", due: "Due date", est: "Original estimate (h)", cost: "Cost ($)", vendor: "Vendor", room: "Location", asset: "Equipment", epic: "Epic", sprint: "Sprint", itype: "Issue type", type: "Team", parent: "Parent" };
function tkDisplay(f, v) {
  if (v === "" || v == null || v === 0 && f !== "cost") return "None";
  if (f === "desc" || f === "title") return v.length > 60 ? v.slice(0, 57) + "…" : v;
  if (f === "assignee") return nameOf(v);
  if (f === "room") return roomName(v);
  if (f === "asset") { const a = S.assets.find((x) => x.id === v); return a ? `${a.id} ${a.name}` : v; }
  if (f === "sprint") return tkSprint(v)?.name || v;
  if (f === "epic" || f === "parent") return `${v} ${tkGet(v)?.title || ""}`.trim();
  if (f === "type") return TK_TEAM[v === "it" ? "it" : "facilities"].name;
  return String(v);
}
function tkSet(t, f, v) {
  const old = t[f];
  if (String(old ?? "") === String(v ?? "")) return;
  if (["est", "cost"].includes(f)) v = Number(v) || 0;
  t[f] = v;
  if (f === "type") { t.comps = []; t.assignee = ""; }
  tkLog(t, { k: "change", f: TK_FIELD_LABEL[f] || f, from: tkDisplay(f, old), to: tkDisplay(f, v) });
  if (f === "assignee") {
    if (v) { tkWatch(t, v); tkFirstResponse(t); tkNotify(t, `${nameOf(S.me)} assigned ${t.id} to ${v === S.me ? "themselves" : nameOf(v)}`, { also: [v] }); }
  } else if (f === "priority") {
    if (v === "Highest" && S.tkx.auto.find((r) => r.id === "urgent")?.on) { tkNotify(t, `${t.id} is now Highest priority`, { also: tkPeople(tkTeam(t)) }); }
  } else tkNotify(t, `${nameOf(S.me)} changed ${TK_FIELD_LABEL[f] || f} on ${t.id}`);
}
function tkAddLabel(t, l) { l = l.trim().toLowerCase().replace(/\s+/g, "-"); if (!l || t.labels.includes(l)) return; t.labels.push(l); tkLog(t, { k: "change", f: "Labels", from: "", to: "+" + l }); }
function tkComment(t, text, internal) {
  text = text.trim(); if (!text) return false;
  const id = ++S.tkx.seq.C;
  tkLog(t, { k: "comment", id, text, internal: !!internal });
  tkWatch(t, S.me);
  if (!internal) tkFirstResponse(t);
  const mentioned = [...text.matchAll(/@([a-z][a-z.]*)/gi)].map((m) => tkResolveMention(m[1])).filter(Boolean);
  mentioned.forEach((u) => { if (!internal || canWorkTkFor(u, t)) tkWatch(t, u); });
  const note = `${nameOf(S.me)} ${internal ? "left an internal note on" : "commented on"} ${t.id}`;
  if (internal) tkNotify(t, note, { internal: true, also: mentioned });
  else tkNotify(t, note, { also: mentioned });
  mentioned.filter((u) => u !== S.me).forEach((u) => S.tkx.notifs.unshift({ id: ++S.tkx.seq.N, to: u, t: tsNow(), ticket: t.id, text: `${nameOf(S.me)} mentioned you on ${t.id}`, read: false, by: S.me }));
  return true;
}
function tkResolveMention(w) { w = w.toLowerCase(); return Object.keys(PEOPLE).find((k) => k === w || PEOPLE[k].name.toLowerCase().split(" ")[0].replace(/^dr\.?/, "") === w || (k !== "admin" && k !== "renter" && PEOPLE[k].name.toLowerCase().replace(/^dr\. /, "").split(" ")[0] === w)); }
const tkMentionHtml = (s) => esc(s).replace(/@([a-z][a-z.]*)/gi, (m, w) => (tkResolveMention(w) ? `<span class="mention">@${nameOf(tkResolveMention(w)).replace(/^Dr\. /, "").split(" ")[0]}</span>` : m)).replace(/\b(TK-\d+)\b/g, '<button type="button" class="lnk" data-tk2="open|$1">$1</button>').replace(/\n/g, "<br>");

/* ---- workflow engine ---- */
function tkCan(t, to) {
  if (!(TK_FLOW[t.status] || []).includes(to)) return false;
  if (canWorkTk(t)) return true;
  if (t.owner !== S.me) return false;
  return to === "reopened" || (to === "closed" && !isDone(t) && ["open", "reopened", "waiting"].includes(t.status));
}
const tkNeedsResolution = (t, to) => (to === "resolved" || to === "closed") && !isDone(t);
function tkMove(t, to, o = {}) {
  if (!tkCan(t, to)) { toast(`${TK_ST[t.status].n} → ${TK_ST[to].n} isn't allowed by the workflow.`); return false; }
  const from = t.status, now = tsNow();
  if (from === "waiting" && t.pausedAt) { t.paused = (t.paused || 0) + (tsMs(now) - tsMs(t.pausedAt)); t.pausedAt = ""; }
  if (to === "waiting") t.pausedAt = now;
  t.status = to;
  if (isDone(t)) { if (!t.resolvedAt) t.resolvedAt = now; if (o.resolution) t.resolution = o.resolution; }
  else { t.resolvedAt = ""; t.resolution = ""; }
  if (to === "inprogress" && !t.assignee && canWorkTk(t) && S.tkx.auto.find((r) => r.id === "self")?.on) { t.assignee = S.me; tkLog(t, { k: "change", f: "Assignee", from: "None", to: nameOf(S.me) + " (automation)" }); }

/* ---- Calendar (due dates and preventive schedules) ---- */
function vTkCalendar() {
  const tk = S.tk, [y, m] = tk.cal.split("-").map(Number), first = new Date(y, m - 1, 1), startPad = first.getDay(), days = new Date(y, m, 0).getDate();
  const prev = ymd(new Date(y, m - 2, 1)).slice(0, 7), next = ymd(new Date(y, m, 1)).slice(0, 7);
  const xs = tkVisible().filter((t) => t.due && !t.parent);
  const sc = S.tkx.schedules.filter((s) => s.on && (S.tk.team === "all" ? myTeams().includes(s.team) : s.team === S.tk.team));
  let cells = "";
  for (let i = 0; i < Math.ceil((startPad + days) / 7) * 7; i++) {
    const dn = i - startPad + 1, ok = dn >= 1 && dn <= days, ds = ok ? `${y}-${pad(m)}-${pad(dn)}` : "";
    const ts = ok ? xs.filter((t) => t.due === ds) : [], ss = ok ? sc.filter((s) => s.next === ds) : [];
    cells += `<div class="cal ${ok ? "" : "off"} ${ds === TODAY ? "today" : ""}">${ok ? `<div class="dn">${dn}</div>` : ""}${ts.slice(0, 3).map((t) => `<button type="button" class="ce ${isDone(t) ? "done" : tkOverdue(t) ? "late" : ""}" data-card="${t.id}" title="${esc(t.title)}">${esc(t.title)}</button>`).join("")}${ts.length > 3 ? `<div class="small muted">+${ts.length - 3} more</div>` : ""}${ss.map((s) => `<div class="ce pm" title="Scheduled: ${esc(s.name)}">⟳ ${esc(s.name)}</div>`).join("")}</div>`;
  }
  return `<div class="panel"><div class="panel-h"><h2>${MON[m - 1]} ${y}</h2><div class="row"><button type="button" class="btn small" data-tk2="cal|${prev}">‹ Prev</button><button type="button" class="btn small" data-tk2="cal|${TODAY.slice(0, 7)}">Today</button><button type="button" class="btn small" data-tk2="cal|${next}">Next ›</button></div></div>
    <div class="panel-b"><div class="calg">${DOW.map((d) => `<div class="dh">${d}</div>`).join("")}${cells}</div><div class="hint" style="margin-top:8px">Due dates of open and resolved tickets. ⟳ marks the next date of a preventive-maintenance schedule.</div></div></div>`;
}

/* ---- Timeline (epics and sprints) ---- */

/* ---- Reports ---- */
function vTkReports() {

  const times = xs.filter((t) => t.resolvedAt && t.resolution !== "Withdrawn by reporter").map((t) => (tsMs(t.resolvedAt) - tsMs(t.created)) / 36e5);
  const avg = times.length ? times.reduce((a, b) => a + b, 0) / times.length : 0;
  const slaDone = xs.filter((t) => t.resolvedAt && tkHasSla(t)).map((t) => tkSla(t).res.state === "met");
  const compliance = slaDone.length ? Math.round((slaDone.filter(Boolean).length / slaDone.length) * 100) : 100;
  const breached = open.filter((t) => tkHasSla(t)).filter((t) => { const s = tkSla(t); return s.res.state === "breach" || s.resp.state === "breach"; });

  <div class="grid2"><div class="panel"><div class="panel-h"><h2>Created vs. resolved</h2><span class="legend"><span><i style="background:var(--info)"></i>Created</span><span><i style="background:var(--ok)"></i>Resolved</span></span></div><div class="panel-b">${svg}</div></div>
  <div class="panel"><div class="panel-h"><h2>Open by priority</h2></div><div class="panel-b">${bars(TK_PRI.map((p) => [p, open.filter((t) => t.priority === p).length, TK_PRI_ICON[p][1]]), Math.max(1, ...TK_PRI.map((p) => open.filter((t) => t.priority === p).length)))}</div></div>

    ${t.itype !== "Sub-task" && t.itype !== "Epic" ? `<div class="panel"><div class="panel-h"><h2>Sub-tasks <span class="muted small">${kdone}/${kids.length}</span></h2></div>${kids.length ? `<div class="bar2"><span style="width:${(kdone / kids.length) * 100}%"></span></div><div class="list">${kids.map(tkRow).join("")}</div>` : ""}${worker ? `<form id="tkSubForm" data-id="${t.id}" class="panel-b row"><input type="text" name="title" class="srch wide" placeholder="Add a sub-task and press Enter" aria-label="New sub-task"><button class="btn small" type="submit">Add</button></form>` : ""}</div>` : ""}

/* ---- Modals ---- */
const mField = (label, inner, wide, id) => `<div class="fld ${wide ? "wide" : ""}"><label${id ? ` for="${id}"` : ""}>${label}</label>${inner}</div>`;
const mOpts = (opts, cur) => opts.map(([v, n]) => `<option value="${esc(v)}" ${String(v) === String(cur) ? "selected" : ""}>${esc(n)}</option>`).join("");
function tkModalShell(title, body, o = {}) {
  return `<div class="ov" data-tk2="closemodal"><div class="dlg ${o.wide ? "w" : ""}" role="dialog" aria-modal="true" aria-labelledby="dlgT"><div class="dlg-h"><h2 id="dlgT">${title}</h2><button type="button" class="btn small" data-tk2="closemodal" aria-label="Close">✕</button></div><div class="dlg-b">${body}</div></div></div>`;
}
function tkCreateBody(d) {
  const worker = anyWorker(), teams = worker ? myTeams() : ["facilities", "it"];
  const team = teams.includes(d.team) ? d.team : teams[0]; d.team = team;

  const types = worker ? ["Problem", "Request", "Task", "Preventive", "Epic", "Sub-task"] : ["Problem", "Request"];
  const epics = S.tickets.filter((t) => t.itype === "Epic" && tkTeam(t) === team), parents = S.tickets.filter((t) => !["Epic", "Sub-task"].includes(t.itype) && canSeeTk(t) && tkTeam(t) === team);
  return `<form class="f" id="tkCreateForm" autocomplete="off">
    ${teams.length > 1 || !worker ? `<div class="fld wide"><span class="lbl">What kind of problem?</span><div class="checks-inline">${[["facilities", "Building or maintenance"], ["it", "IT or tech"]].filter(([v]) => teams.includes(v)).map(([v, n]) => `<label><input type="radio" name="team" value="${v}" ${team === v ? "checked" : ""}> ${n}</label>`).join("")}</div></div>` : `<input type="hidden" name="team" value="${team}">`}
    ${worker ? mField("Issue type", `<select name="itype" id="m_itype">${mOpts(types.map((x) => [x, x]), d.itype)}</select>`, false, "m_itype") : `<input type="hidden" name="itype" value="${d.itype || "Problem"}">`}
    ${mField(worker ? "Priority" : "Urgency", worker ? `<select name="priority" id="m_pri">${mOpts(TK_PRI.map((x) => [x, x]), d.priority)}</select>` : `<select name="priority" id="m_pri">${mOpts([["Low", "Low"], ["Medium", "Normal"], ["Highest", "Urgent (safety or a service today)"]], d.priority)}</select>`, false, "m_pri")}
    ${mField("Summary", `<input type="text" name="title" id="m_title" value="${esc(d.title)}" placeholder="Projector in Room 240 shows no picture" required>`, true, "m_title")}
    <div class="wide" id="tkDupes" style="grid-column:1/-1"></div>
    ${mField(worker ? "Description" : "What's wrong?", `<textarea name="desc" id="m_desc" placeholder="What happened, when, and anything you already tried.">${esc(d.desc)}</textarea>`, true, "m_desc")}
    ${mField("Category", `<select name="comp" id="m_comp"><option value="">Not sure</option>${mOpts(comps.map((c) => [c.name, c.name]), d.comp)}</select>`, false, "m_comp")}
    ${mField("Where?", `<select name="room" id="m_room">${mOpts([...ROOMS.filter((r) => r.id !== "offsite").map((r) => [r.id, r.name]), ["office", "Admin office"], ["parking", "Parking lot / outside"]], d.room)}</select>`, false, "m_room")}
    ${mField("Equipment (optional)", `<select name="asset" id="m_asset"><option value="">Not sure / none</option>${mOpts(assets.map((a) => [a.id, `${a.id} · ${a.name}`]), d.asset)}</select>`, !worker, "m_asset")}
    ${worker ? mField("Assignee", `<select name="assignee" id="m_asg"><option value="">Automatic</option>${mOpts(tkPeople(team).map((p) => [p, nameOf(p)]), d.assignee)}</select>`, false, "m_asg") : ""}
    ${worker ? mField("Due date", `<input type="date" name="due" id="m_due" value="${esc(d.due)}">`, false, "m_due") : ""}
    ${worker ? mField("Labels", `<input type="text" name="labels" id="m_lab" value="${esc(d.labels)}" placeholder="wifi, procurement">`, false, "m_lab") : ""}
    ${worker ? mField("Original estimate (hours)", `<input type="number" name="est" id="m_est" min="0" step="0.25" value="${esc(d.est)}">`, false, "m_est") : ""}
    ${worker && d.itype !== "Epic" && d.itype !== "Sub-task" ? mField("Sprint", `<select name="sprint" id="m_sp"><option value="">Backlog</option>${mOpts(S.tkx.sprints.filter((s) => s.state !== "done").map((s) => [s.id, s.name]), d.sprint)}</select>`, false, "m_sp") : ""}
    ${worker && d.itype !== "Epic" && d.itype !== "Sub-task" ? mField("Epic", `<select name="epic" id="m_ep"><option value="">None</option>${mOpts(epics.map((e) => [e.id, e.title]), d.epic)}</select>`, false, "m_ep") : ""}
    ${worker && d.itype === "Sub-task" ? mField("Parent issue", `<select name="parent" id="m_par" required><option value="">Choose…</option>${mOpts(parents.map((p) => [p.id, `${p.id} · ${p.title}`]), d.parent)}</select>`, true, "m_par") : ""}
    <div class="fld wide"><label for="m_files">Photo or file (optional)</label><input type="file" name="files" id="m_files" multiple accept="image/*,.pdf">${d.files && d.files.length ? `<span class="hint">${d.files.map(esc).join(", ")}</span>` : ""}</div>
    <div class="actions">${worker ? '<label class="small" style="margin-right:auto"><input type="checkbox" name="another"> Create another</label>' : ""}<button type="button" class="btn" data-tk2="closemodal">Cancel</button><button class="btn primary" type="submit">${worker ? "Create" : "Submit ticket"}</button></div></form>`;
}
function tkModalHTML() {
  const m = S.tk.modal; if (!m) return "";
  if (m.kind === "create") return tkModalShell(anyWorker() ? "Create issue" : "Report a problem", tkCreateBody(m.d), { wide: true });
  if (m.kind === "notifs") {
    const ns = S.tkx.notifs.filter((n) => n.to === S.me).sort((a, b) => (b.t > a.t ? 1 : -1)).slice(0, 40);
    return tkModalShell("Notifications", `<div class="row" style="margin-bottom:8px"><span class="small muted">${ns.filter((n) => !n.read).length} unread. Email goes out for the same events.</span><span class="spacer"></span><button type="button" class="btn small" data-tk2="markread">Mark all read</button></div><div class="list">${ns.map((n) => `<button type="button" class="item ${n.read ? "" : "unread"}" data-tk2="notifopen|${n.id}"><div><div class="t">${esc(n.text)}</div><div class="s">${n.ticket} · ${ago(n.t)}</div></div></button>`).join("") || '<div class="empty">Nothing yet.</div>'}</div>`);
  }
  const t = m.id && tkGet(m.id);
  if (m.kind === "transition") {
    const needs = tkNeedsResolution(t, m.to);
    const kids = tkKids(t).filter((k) => !isDone(k));
    return tkModalShell(`${TK_TRANS[m.to]} · ${t.id}`, `<form class="f" id="tkTransForm">${kids.length && needs ? `<div class="note warn" style="grid-column:1/-1">${kids.length} sub-task${kids.length > 1 ? "s are" : " is"} still open. They stay open when you resolve this.</div>` : ""}
      ${needs ? mField("Resolution", `<select name="resolution" id="t_res">${mOpts(TK_RESOLUTIONS.filter((r) => m.to === "closed" || r !== "Withdrawn by reporter" || t.owner === S.me).map((r) => [r, r]), m.to === "closed" && t.owner === S.me && !canWorkTk(t) ? "Withdrawn by reporter" : "Fixed")}</select>`, true, "t_res") : ""}
      ${mField(m.to === "reopened" ? "Why is it still a problem?" : "Comment (optional)", `<textarea name="comment" id="t_c" placeholder="${m.to === "resolved" ? "Replaced the HDMI switch." : ""}"></textarea>`, true, "t_c")}
      ${canWorkTk(t) && needs ? mField("Time spent (hours, optional)", `<input type="number" name="hours" id="t_h" min="0" step="0.25">`, false, "t_h") : ""}

function tkDrag(e) {
  const tk = S.tk;
  if (e.type === "dragstart") { const c = e.target.closest("[data-drag]"); if (!c) return; tk.dragging = c.dataset.drag; e.dataTransfer.setData("text/plain", tk.dragging); e.dataTransfer.effectAllowed = "move"; c.classList.add("dragging"); return; }
  if (e.type === "dragend") { tk.dragging = null; document.querySelectorAll(".dragging, .over").forEach((x) => x.classList.remove("dragging", "over")); return; }
  const z = e.target.closest("[data-drop], [data-drop-sprint]"); if (!z || !tk.dragging) return;
  if (e.type === "dragover") { e.preventDefault(); z.classList.add("over"); return; }
  if (e.type === "dragleave") { if (!z.contains(e.relatedTarget)) z.classList.remove("over"); return; }
  if (e.type === "drop") {
    e.preventDefault(); z.classList.remove("over"); const t = tkGet(tk.dragging); tk.dragging = null; if (!t) return;
    if (z.dataset.drop) {
      if (!canWorkTk(t)) return toast("Only the team can change a ticket's status.");
      const col = TK_COLS.find((c) => c.id === z.dataset.drop); if (col.sts.includes(t.status)) return;
      const to = col.id === "done" ? "resolved" : col.id === "open" && isDone(t) ? "reopened" : col.sts[0];
      return tkMoveOrAsk(t, to);
    }
    if (z.dataset.dropSprint) { tkSet(t, "sprint", z.dataset.dropSprint === "__none" ? "" : z.dataset.dropSprint); toast(`${t.id} moved`); return render(); }
  }
}
function tkKey(e) {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if (e.key === "Escape" && S.tk && S.tk.modal) { S.tk.modal = null; return render(); }
  if (e.key === "Enter" && e.target.matches("[data-tk2][role=button]")) { e.preventDefault(); return e.target.click(); }
  if (typing || e.metaKey || e.ctrlKey || e.altKey || !S || S.me === "renter" || !(S.view === "tickets" || String(S.arg).startsWith("TK-"))) return;
  if (e.key === "c") { e.preventDefault(); tkOpenCreate(); }
  if (e.key === "/") { const q = document.getElementById("tkq") || document.getElementById("tkbq"); if (q) { e.preventDefault(); q.focus(); } }
}
document.addEventListener("click", tkClick);
document.addEventListener("submit", tkSubmit);
document.addEventListener("change", tkChange);
document.addEventListener("input", tkInput);
["dragstart", "dragend", "dragover", "dragleave", "drop"].forEach((n) => document.addEventListener(n, tkDrag));
document.addEventListener("keydown", tkKey);

const AS_ST = { "In use": "ok", Available: "ok", "Checked out": "info", "Needs repair": "bad" };
function vAssets() {

    ${xs.map((a) => `<tr><td class="mono"><button type="button" class="crumb" style="border:0;background:none;padding:0;cursor:pointer;color:var(--accent-text);font-family:var(--mono)" data-asset="${a.id}">${a.id}</button></td><td>${esc(a.name)}<div class="small muted">${esc(a.cat)}</div></td><td>${esc(roomName(a.room))}</td><td><span class="pill ${AS_ST[a.status] || ""}">${esc(a.status)}</span>${a.out ? `<div class="small muted">${esc(a.out.to)} · due ${a.out.due.slice(5)}</div>` : ""}</td></tr>`).join("")}
  </tbody></table></div></div>

function assetDetail(a) {
  const tks = S.tickets.filter((t) => t.asset === a.id);
  return `<div class="panel-h"><h2><span class="mono">${a.id}</span> · ${esc(a.name)}</h2><span class="pill ${AS_ST[a.status] || ""}">${esc(a.status)}</span></div><div class="panel-b stack">

      if (bad >= 0) return toast(`Charge ${bad + 1}: add the date, the merchant${lines[bad].flag === "repay" ? " and who will repay it" : ""}.`);
      const dup = S.pos.find((p) => p.card && p.card.last4 === k.last4 && p.card.month === d.month && p.status !== "rejected");
      c = po({ id: "PO-" + ++S.seq.PO, owner: S.me, type: "card", committee: k.committee, card: { last4: k.last4, month: d.month }, payee: `IAR card ···${k.last4} · ${fmtYm(d.month)}`, desc: d.desc,
        lines: lines.map((l) => ({ date: l.date, merchant: l.merchant.trim(), acct: l.acct, amount: Number(l.amount), flag: l.flag || "", repayBy: l.flag === "repay" ? l.repayBy.trim() : "", noReceipt: Boolean(l.noReceipt) })), status: "finance", created: TODAY });
      c.log.push({ t: TODAY, who: "system", text: "Card receipts go straight to finance review" + (dup ? ` (${dup.id} already covers this card and month)` : "") });
    } else {
      const isChair = me().roles.includes("chairs") && me().committees.includes(d.committee);
      const hasChair = Object.keys(PEOPLE).some((p) => p !== "admin" && p !== S.me && roleOf(p, "chairs") && PEOPLE[p].committees.includes(d.committee));
      const director = d.committee === "Social & Welfare" ? null : directorsOf(d.committee).find((p) => p !== S.me);
      const backup = isChair ? BACKUP[d.committee] : null;
      const approver = isChair ? backup || director || null : !hasChair ? director || null : null;
      c = po({ id: "PO-" + ++S.seq.PO, owner: S.me, type: d.type, committee: d.committee, payee: d.payee, desc: d.desc, lines: lines.map((l) => [l.acct, Number(l.amount), l.note]), eventId: d.eventId || null, status: approver || (!isChair && hasChair) ? "chair" : "finance", approver, created: TODAY });
      if (isChair) c.log.push({ t: TODAY, who: "system", text: backup ? `Requester is the ${d.committee} chair, so it goes to the backup approver, ${nameOf(backup)}` : director ? `Requester is the ${d.committee} chair, so it goes to the committee's director, ${nameOf(director)}` : "Requester is the chair and no backup is set: finance reviews it" });
      else if (!hasChair) c.log.push({ t: TODAY, who: "system", text: director ? `${d.committee} has no chair, so it goes to the committee's director, ${nameOf(director)}` : `${d.committee} has no chair on file: finance reviews it` });
    }
    S.pos.unshift(c);
    poNotify(c, null);
    if (d.eventId) { const evc = getCard(d.eventId); evc.linkedPOs.push(c.id); log(evc, `Purchase ${c.id} linked (${money(total(c))})`); }
    S.poDraft = null;
    toast(`${c.id} submitted. Waiting on ${waitingOn(c)}.`);
    return go("card", c.id);
  }
  if (e.target.id === "coForm") {
    const c = getCard(S.arg); c.status = "closed"; c.attendance = Number(document.getElementById("co_att").value || c.attendance);
    log(c, `Closed out: ${c.attendance} attended. Notes saved`);
    toast("Event closed. Its costs and attendance are on record.");
    return render();
  }
  if (e.target.id === "shForm") {
    const f = e.target.elements, type = f.type.value;
    if (!f.text.value.trim()) return toast("Say what you need so finance knows what to look at.");
    if (type === "amendment" && (!Number(f.amount.value) || f.from.value === f.committee.value)) return toast("An amendment needs an amount and two different cost centers.");
    const r = { id: "SR-" + ++S.seq.SR, owner: S.me, type, committee: f.committee.value, text: f.text.value.trim(), status: "open", created: TODAY };
    if (type === "amendment") { r.from = f.from.value; r.amount = Number(f.amount.value); }
    S.shReq.unshift(r); S.shForm = false; toast(`${r.id} sent to the ${SR_TYPES[type].to}`); return render();
  }
  if (e.target.id === "rnForm") {
    const f = e.target.elements;
    const r = { kind: "rental", id: "RN-" + ++S.seq.RN, org: f.org.value, contact: f.contact.value, email: f.email.value, date: f.date.value, start: f.start.value, end: f.end.value, room: f.room.value, attendance: Number(f.attendance.value), purpose: f.purpose.value, status: "submitted", insurance: "insurance.pdf", created: TODAY };
    S.rentals.unshift(r); S.rnDone = r; return render();
  }
});

document.addEventListener("mousemove", (e) => {
  const tip = document.getElementById("tip"); const el = e.target.closest && e.target.closest("[data-tip]");
  if (!el) { tip.hidden = true; return; }
  tip.textContent = el.getAttribute("data-tip"); tip.hidden = false;
  const x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8); tip.style.left = x + "px"; tip.style.top = (e.clientY + 14) + "px";
});
seed();
S.guide = window.innerWidth >= 1200;
render();
</script>
