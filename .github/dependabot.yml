# Small, regular updates instead of a painful jump later (docs/design-system.md).
# Once a month: one pull request per folder for minor and patch updates, and a
# separate one for each major version, which needs reading the release notes.
# CI (workflows/ci.yml) runs the tests, typecheck and build on each.
version: 2
updates:
  - package-ecosystem: npm
    directory: /portal
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      portal-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /ops/go-live
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      go-live-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
